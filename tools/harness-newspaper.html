<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>harness-newspaper</title>
<style>
/* lokalna kopia Amiri (ten sam plik, który Foundry serwuje z /fonts/amiri) — w Foundry krój deklaruje sam rdzeń */
@font-face { font-family: "Amiri"; src: url("fonts/amiri-regular.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Amiri"; src: url("fonts/amiri-bold.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "Signika"; src: url("fonts/signika-regular.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Signika"; src: url("fonts/signika-medium.woff2") format("woff2"); font-weight: 500; }
/* Modesto Condensed: krój rdzenia Foundry (/fonts/modesto-condensed); lokalna kopia nieśledzona w git (licencja Fontspring) */
@font-face { font-family: "Modesto Condensed"; src: url("fonts/modesto-condensed.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Modesto Condensed"; src: url("fonts/modesto-condensed-bold.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "Signika"; src: url("fonts/signika-semibold.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Signika"; src: url("fonts/signika-bold.woff2") format("woff2"); font-weight: 700; }
html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#ddd;font:13px/1.35 system-ui,sans-serif}
/* „stara” mapa: rysowana na płótnie (jak płótno Foundry) — z niego robimy zrzut; „nowa” mapa leży pod spodem */
/* nowa scena: obraz mapy w „świecie” (kontener = kamera, transform jak stage w Foundry); z paddingiem tło sceny widać wokół */
#newmap{position:fixed;inset:0;overflow:hidden;background:#222}
#newcam{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0}
#newimg{position:absolute;display:block}
#oldmap{position:fixed;inset:0;width:100%;height:100%;display:block}
#oldmap.gone{visibility:hidden}
.fake{position:fixed;background:rgba(20,18,26,.82);border:1px solid rgba(255,255,255,.12);display:none;z-index:50}
body.ui .fake{display:block}
#f-left{left:16px;top:16px;width:72px;bottom:16px}
#f-side{right:0;top:0;bottom:0;width:300px}
#f-hot{bottom:16px;height:60px;left:50%;width:560px;transform:translateX(-50%)}
#host{position:fixed;inset:0;z-index:20;pointer-events:none}
#panel{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:100;width:min(980px,calc(100% - 24px));background:rgba(12,12,16,.92);
  border:1px solid #333;border-radius:8px;padding:8px 10px;display:grid;gap:6px}
#panel.min .more{display:none}
#panel label{display:inline-flex;gap:4px;align-items:center;margin-right:8px;white-space:nowrap}
#panel input[type=text]{background:#000;color:#eee;border:1px solid #444;width:170px}
#panel button{background:#2b2b35;color:#eee;border:1px solid #555;border-radius:4px;padding:3px 9px;cursor:pointer}
#panel button:hover{background:#3a3a48}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#log{font:11px ui-monospace,monospace;opacity:.8;min-height:1.3em}
body.clean #panel{display:none}
#panel textarea{background:#000;color:#eee;border:1px solid #444;width:100%;height:4.2em;font:12px system-ui,sans-serif}
#sheet{position:fixed;inset:0;z-index:90;background:#222;overflow:auto;display:none;text-align:center}
#sheet.on{display:block}
#sheet canvas{display:inline-block;margin:12px;box-shadow:0 4px 18px rgba(0,0,0,.6)}
</style></head><body class="ui">
<div id="newmap"><div id="newcam"><img id="newimg" alt=""></div></div>
<canvas id="oldmap"></canvas>
<div class="fake" id="f-left"></div><div class="fake" id="f-side"></div><div class="fake" id="f-hot"></div>

<div id="sheet" title="klik = zamknij"></div>
<div id="panel">
  <div class="row">
    <button id="run">▶ Zmiana sceny (całość)</button><button id="press">1. uformuj</button><button id="spin">2. odlot</button>
    <button id="close">■ zamknij</button><button id="toggle">zwiń panel</button>
  </div>
  <div class="row more">
    <label><input id="ui" type="checkbox" checked> atrapy UI Foundry</label>
    <label><input id="reduced" type="checkbox"> reduced motion</label>
    <label><input id="lite" type="checkbox"> lite</label>
    <label title="jak „Core Rules”: mała mapa na środku dużego pola koloru tła sceny (stara i nowa scena)"><input id="pad" type="checkbox"> tło sceny (padding)</label>
    <label>stara mapa <select id="old"><option value="ulica">ulica</option><option value="baza">baza</option><option value="miasto">miasto</option></select></label>

  <div class="row more">

    <label>teksty <select id="texts"><option value="default">domyślne (puste)</option><option value="custom">własne krótkie</option><option value="long">bardzo długie</option><option value="short">jednowyrazowe</option><option value="polish">po polsku</option></select></label>
    <label>winieta <input id="masthead" type="text" value="" placeholder="puste = domyślna"></label>

  </div>
  <div class="row more">
    <label>podtytuł <input id="deck" type="text" value=""></label>
    <label>podpis <input id="caption" type="text" value=""></label>
    <label>miejsce <input id="place" type="text" value="" style="width:100px"></label>
    <label>data <input id="date" type="text" value="" style="width:150px"></label>
    <button id="pageview">strona w 1:1</button>
  </div>
  <div class="row more">
    <textarea id="stories" placeholder="pozostałe nagłówki, po jednym w wierszu (puste = domyślne)"></textarea>
    <label>papier <input id="paper" type="color" value="#ebe3cf"></label>
    <label>akcent <input id="accent" type="color" value="#d0121b"></label>

  <div class="row more">
    <label>odlot (s) <input id="spinSec" type="number" value="2.4" min="1" max="5" step="0.1" style="width:52px"></label>
    <label>obroty <input id="turns" type="number" value="3" min="1" max="6" step="1" style="width:44px"></label>

    <label>ziarno <input id="seed" type="number" value="7" style="width:70px"></label>
    <label title="multi: tokeny = 3 grupy + samotny + ukryty (półprzezroczysty, widok MG — nie może trafić na zdjęcie)">fotograf <select id="shots"><option value="single">jedno zdjęcie</option><option value="multi">multi (tokeny)</option><option value="none">multi bez tokenów</option></select></label>
  </div>
  <div id="log" class="more"></div>
</div>
<script type="module">
import { createNewspaper, paintPage, paintModern, sanitizeNewspaper, HOLD_MS, PRESS_MS, PUSH_MS, photoCrop, sameRect, coverView, cameraEase, revealCameraMs, REVEAL_ZOOM,
  SHOT_CAP, clusterRects, shotFrame, detailSpots, shootMs } from "../scripts/fx/newspaper.mjs";
const $ = (id) => document.getElementById(id);
const log = (m) => { $("log").textContent = m; console.log("[newspaper]", m); };
const img = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const data = () => sanitizeNewspaper({ style: $("style").value, accent: $("accent").value, paper: $("paper").value,
  masthead: $("masthead").value, kicker: $("kicker").value, headline: $("headline").value, deck: $("deck").value, caption: $("caption").value,
  place: $("place").value, date: $("date").value, stories: $("stories").value,
  spinSec: +$("spinSec").value, turns: +$("turns").value, direction: $("direction").value, shots: $("shots").value === "single" ? "single" : "multi" });
/** Zestawy tekstów do testu dopasowania: puste (domyślne), krótkie własne, skrajnie długie, jednowyrazowe, polskie znaki. */
const TEXTS = {
  default: { masthead: "", kicker: "Extra", headline: "", deck: "", caption: "", place: "", date: "", stories: "" },
  custom: { masthead: "The Evening Sentinel", kicker: "Late City", headline: "Bank Vault Found Empty", deck: "Night Watchman Saw Nothing; Police Search the Docks", caption: "The vault as it was found at dawn.", place: "New Carthage", date: "Tuesday, March 4, 1941", stories: "Mayor Denies Rumors\nSchools Closed for Repairs\nDock Strike Ends\nFair Opens Saturday" },
  long: { masthead: "The Greater Metropolitan Evening Chronicle & Herald", kicker: "Special Late Extra Edition", headline: "Unprecedented Disturbance Paralyzes the Entire Waterfront District as Thousands Gather and Authorities Remain", deck: "Eyewitnesses From Every Corner of the City Offer Conflicting Accounts of What Happened Shortly After Midnight While Officials Refuse to Answer Any Questions From the Press",
    caption: "A view of the waterfront taken from the roof of the customs house at a quarter past one in the morning, shortly before police cleared the area of onlookers and reporters.", place: "South Harbor Junction City", date: "Wednesday, September 30, 1936",
    stories: "Councilmen Argue Late Into the Night Over Emergency Spending Bill and New Curfew\nHarbor Traffic Halted Indefinitely While Coast Guard Searches the Outer Breakwater\nExtraordinarilylongwordthatcannotbreakanywhereatallreally\nMuseum Reports Missing Artifact\nStorm Warning\nRailroad Promises Faster Service on All Lines" },
  short: { masthead: "Bugle", kicker: "", headline: "War!", deck: "Yes.", caption: "Here.", place: "Ur", date: "", stories: "A\nB\nC\nD\nE\nF" },
  polish: { masthead: "Kurier Łódzki Wieczorny", kicker: "Wydanie nadzwyczajne", headline: "Żółta mgła nad śródmieściem – zagadka się pogłębia", deck: "Świadkowie opisują dziwne zdarzenia nad rzeką; władze obiecują pełne śledztwo", caption: "Miejsce zdarzenia sfotografowane przez naszego reportera kilka minut temu.", place: "Łódź", date: "", stories: "Rada miasta zwołana na posiedzenie\nRuch w porcie wstrzymany\nPatrole nocne podwojone\nZniknął eksponat z muzeum\nOstrzeżenie przed burzą\nKolej obiecuje szybsze pociągi" },
};
const setTexts = (k) => { for (const [f, v] of Object.entries(TEXTS[k])) $(f).value = v.replaceAll("\\n", "\n"); };
/** Sama strona w rozdzielczości 1:1 (do czytania tekstu): px płótna = px ekranu, przewijana. */
function pageView(W = 1100) {
  const { photo, shots } = capture(), d = data();
  const page = (d.style === "modern" ? paintModern : paintPage)({ W, photo, aspect: photo.width / photo.height, data: d, seed: +$("seed").value, shots,
    fonts: { serif: "Amiri", sans: "Signika", cond: "Modesto Condensed" } });
  const sh = $("sheet"); sh.replaceChildren(page.canvas); sh.classList.add("on");
  return { W, H: page.H, photoRect: page.photoRect };
}
/** Te same odstępy, które w Foundry liczy uiBounds() (kolumna narzędzi, pasek boczny, pasek makr). */
function safe() {
  if (!$("ui").checked) return { left: 16, right: 16, top: 16, bottom: 16 };
  const l = $("f-left").getBoundingClientRect(), s = $("f-side").getBoundingClientRect(), h = $("f-hot").getBoundingClientRect();
  return { left: l.right + 12, right: innerWidth - s.left + 12, top: 16, bottom: innerHeight - h.top + 10 };
}
/* „Świat” = px ekranu w spoczynku. Bez paddingu mapa wypełnia ekran (cover); z paddingiem leży mała w polu koloru tła
   (jak scena „Core Rules”: duży niebieski padding), lekko poza środkiem, żeby kadr musiał się przesunąć, nie tylko powiększyć. */
const PAD_BG = "#2f5f9e", NEW_BG = "#3d6b2f";
const images = {};
const loadImg = async (name) => (images[name] ??= await img(`../samples/${name}/painted.png`));
function sceneRect(i, padded, fx = 0.46, fy = 0.54) {
  const W = innerWidth, H = innerHeight;
  if (!padded) { const k = Math.max(W / i.naturalWidth, H / i.naturalHeight); return { x: (W - i.naturalWidth * k) / 2, y: (H - i.naturalHeight * k) / 2, w: i.naturalWidth * k, h: i.naturalHeight * k }; }
  const w = W * 0.4, h = (w * i.naturalHeight) / i.naturalWidth;
  return { x: W * fx - w / 2, y: H * fy - h / 2, w, h };
}
/* Atrapy tokenów (jak w Foundry: kwadrat siatki, obraz w ramce). Pozycja = punkt mapy (fx, fy) + przesunięcie w polach siatki.
   Trzy grupy, samotny token i jeden UKRYTY (MG widzi go półprzezroczystego; nie może trafić na żadne zdjęcie). */
const TOKENS = [
  { n: "A", c: "#b8322a", fx: 0.30, fy: 0.42, dx: 0, dy: 0 }, { n: "B", c: "#2a6bb8", fx: 0.30, fy: 0.42, dx: 1.2, dy: 0.3 }, { n: "C", c: "#2f9a52", fx: 0.30, fy: 0.42, dx: 0.4, dy: 1.3 },
  { n: "D", c: "#8e44ad", fx: 0.68, fy: 0.66, dx: 0, dy: 0 }, { n: "E", c: "#d68910", fx: 0.68, fy: 0.66, dx: 1.5, dy: -0.4 },
  { n: "F", c: "#16a085", fx: 0.56, fy: 0.12, dx: 0, dy: 0 },
  { n: "G", c: "#c0392b", fx: 0.84, fy: 0.30, dx: 0, dy: 0 }, { n: "K", c: "#7f8c8d", fx: 0.84, fy: 0.30, dx: 1.1, dy: 0.2 },
  { n: "H", c: "#444", fx: 0.12, fy: 0.75, dx: 0, dy: 0, hidden: true },
];
const gridSize = () => ($("pad").checked ? 30 : 70);
const tokenRects = (rect) => (($("shots").value === "none") ? [] : TOKENS.map((t) => {
  const G = gridSize();
  return { ...t, x: rect.x + t.fx * rect.w + t.dx * G, y: rect.y + t.fy * rect.h + t.dy * G, w: G, h: G };
}));
/** Narysuj scenę (tło + mapa + siatka sceny + tokeny) kamerą view = {x, y (lewy górny róg w świecie), k (px płótna na jedn. świata)}. */
function drawScene(g, cw, ch, i, rect, view, bg, veil = false) {
  g.fillStyle = bg; g.fillRect(0, 0, cw, ch);
  const X = (x) => (x - view.x) * view.k, Y = (y) => (y - view.y) * view.k;
  g.drawImage(i, X(rect.x), Y(rect.y), rect.w * view.k, rect.h * view.k);
  g.save(); g.beginPath(); g.rect(X(rect.x), Y(rect.y), rect.w * view.k, rect.h * view.k); g.clip();
  g.strokeStyle = "rgba(0,0,0,.18)"; g.lineWidth = 1;
  for (let x = rect.x; x < rect.x + rect.w; x += gridSize()) { g.beginPath(); g.moveTo(Math.round(X(x)) + 0.5, Y(rect.y)); g.lineTo(Math.round(X(x)) + 0.5, Y(rect.y + rect.h)); g.stroke(); }
  for (let y = rect.y; y < rect.y + rect.h; y += gridSize()) { g.beginPath(); g.moveTo(X(rect.x), Math.round(Y(y)) + 0.5); g.lineTo(X(rect.x + rect.w), Math.round(Y(y)) + 0.5); g.stroke(); }
  for (const t of tokenRects(rect)) {
    if (veil && t.hidden) continue; // zdjęcia multi: bez ukrytych tokenów (jak captureView w Foundry)
    const r = (t.w * view.k) / 2, cx = X(t.x) + r, cy = Y(t.y) + r;
    g.globalAlpha = t.hidden ? 0.5 : 1;
    g.fillStyle = "rgba(0,0,0,.35)"; g.beginPath(); g.arc(cx + r * 0.08, cy + r * 0.12, r * 0.9, 0, 7); g.fill();
    g.fillStyle = t.c; g.beginPath(); g.arc(cx, cy, r * 0.88, 0, 7); g.fill();
    g.lineWidth = Math.max(1, r * 0.12); g.strokeStyle = "#f4ead2"; g.stroke();
    g.fillStyle = "#fff"; g.font = `700 ${Math.round(r * 0.95)}px Signika, sans-serif`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(t.n, cx, cy + r * 0.05);
    g.globalAlpha = 1;
  }
  g.restore();
}
let oldScene = null, newScene = null;
/** „Płótno Foundry”: stara mapa narysowana jak scena (w Foundry: stage z paddingiem i kolorem tła). */
async function drawOld() {
  const c = $("oldmap"); c.width = innerWidth; c.height = innerHeight;
  const pad = $("pad").checked;
  const i = await loadImg($("old").value);
  oldScene = { i, rect: sceneRect(i, pad) };
  drawScene(c.getContext("2d"), c.width, c.height, i, oldScene.rect, { x: 0, y: 0, k: 1 }, PAD_BG);
  // nowa scena: kamera w widoku startowym (z paddingiem — widać tło dookoła)
  const n = await loadImg($("new").value);
  newScene = { i: n, rect: sceneRect(n, pad, 0.55, 0.47) };
  $("newmap").style.background = pad ? NEW_BG : "#222";
  const im = $("newimg"); im.src = n.src;
  Object.assign(im.style, { left: `${newScene.rect.x}px`, top: `${newScene.rect.y}px`, width: `${newScene.rect.w}px`, height: `${newScene.rect.h}px` });
  $("newcam").getAnimations().forEach((a) => a.cancel());
  $("newcam").style.transform = "none";
}
/**
 * Zrzut „płótna” jak captureView() w Foundry: `cover` = dokładnie ekran; gdy widać tło poza sceną — `photo` = scena
 * wyrenderowana jeszcze raz kamerą na kadrze photoCrop (pełna rozdzielczość), `crop` = kadr w px ekranu. ≤ 1920 px.
 */
function capture() {
  const src = $("oldmap"), k = Math.min(1, 1920 / src.width);
  const c = document.createElement("canvas"); c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  const view = { x: 0, y: 0, w: innerWidth, h: innerHeight };
  const crop = photoCrop(view, oldScene.rect, innerWidth / innerHeight);
  const multi = data().shots === "multi" ? data().style : null;
  if (sameRect(crop, view, 1) && !multi) return { photo: c, cover: null, crop: null, shots: null };
  const p = document.createElement("canvas"); p.width = c.width; p.height = c.height;
  drawScene(p.getContext("2d"), p.width, p.height, oldScene.i, oldScene.rect, { x: crop.x, y: crop.y, k: p.width / crop.w }, PAD_BG, !!multi);
  const shots = multi ? captureShots(multi, crop, p) : null;
  if (sameRect(crop, view, 1)) return { photo: p, cover: null, crop: null, shots };
  return { photo: p, cover: c, crop, shots };
}
/** Kopia captureShots z newspaper-play.mjs (te same funkcje grupowania i kadrowania; „render” = drawScene kamerą na kadrze). */
function captureShots(style, est, establishing) {
  const cap = SHOT_CAP[style], grid = gridSize(), scene = oldScene.rect, aspect = innerWidth / innerHeight;
  const outW = Math.min(1280, innerWidth * (devicePixelRatio || 1));
  const rects = tokenRects(scene).filter((t) => !t.hidden).map((t) => {
    const x0 = Math.max(t.x, scene.x), y0 = Math.max(t.y, scene.y), x1 = Math.min(t.x + t.w, scene.x + scene.w), y1 = Math.min(t.y + t.h, scene.y + scene.h);
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }).filter((r) => r.w > 1 && r.h > 1);
  const minW = Math.max(4.5 * grid, (outW / 2) * (scene.w / oldScene.i.naturalWidth)); // tekstura mapy powiększona najwyżej 2×
  const sf = safe(), free = { x: sf.left / innerWidth, y: sf.top / innerHeight, w: 1 - (sf.left + sf.right) / innerWidth, h: 1 - (sf.top + sf.bottom) / innerHeight };
  const framed = (gs) => gs.map((g) => ({ g, s: shotFrame(g.rect, scene, aspect, { pad: 0.6 * grid, minW, safe: free }) })).filter(({ s }) => s.frame.w < 0.8 * est.w);
  let picked = framed(clusterRects(rects, 2.5 * grid, cap));
  if (picked.length < cap) { const loose = framed(clusterRects(rects, 2.5 * grid, Infinity)).slice(0, cap); if (loose.length > picked.length) picked = loose; }
  const subjects = picked.map(({ g, s }) => ({ ...s, kind: "group", count: g.count, aspect: (s.focus.w * s.frame.w) / (s.focus.h * s.frame.h) }));
  if (!subjects.length) for (const n of detailSpots(establishing, Math.min(cap, 2))) {
    const frame = { x: est.x + n.x * est.w, y: est.y + n.y * est.h, w: n.w * est.w, h: (n.w * est.w) / aspect };
    subjects.push({ frame, focus: { x: 0.15, y: 0.15, w: 0.7, h: 0.7 }, kind: "detail", count: 0, aspect });
  }
  return subjects.map((s) => {
    const t0 = performance.now(), image = document.createElement("canvas");
    image.width = Math.round(outW); image.height = Math.round(outW / aspect);
    drawScene(image.getContext("2d"), image.width, image.height, oldScene.i, scene, { x: s.frame.x, y: s.frame.y, k: image.width / s.frame.w }, PAD_BG, true);
    return { image, focus: s.focus, aspect: s.aspect, kind: s.kind, count: s.count, ms: Math.round(performance.now() - t0),
      pos: { x: (s.frame.x + s.frame.w / 2 - est.x) / est.w, y: (s.frame.y + s.frame.h / 2 - est.y) / est.h } };
  });
}
/**
 * Kamera odsłony (jak frameRevealCamera w Foundry): kadr nowej sceny bez tła (coverView), start REVEAL_ZOOM bliżej,
 * osiadanie przez czas odlotu tą samą krzywą (Foundry: canvas.animatePan interpoluje x, y, scale z easingiem).
 */
function revealCamera(reducedMotion) {
  const W = innerWidth, H = innerHeight, screen = { w: W, h: H }, r = newScene.rect;
  const target = coverView({ x: W / 2, y: H / 2, scale: 1 }, r, screen);
  const start = coverView({ x: target.x, y: target.y, scale: target.scale * REVEAL_ZOOM }, r, screen);
  const tf = (v) => `translate(${(W / 2 - v.x * v.scale).toFixed(2)}px, ${(H / 2 - v.y * v.scale).toFixed(2)}px) scale(${v.scale.toFixed(5)})`;
  const cam = $("newcam");
  cam.getAnimations().forEach((a) => a.cancel());
  if (reducedMotion) { cam.style.transform = tf(target); return; }
  const kf = [];
  for (let i = 0; i <= 40; i++) {

let np = null;
function begin() {

  const { photo, cover, crop, shots } = capture();
  const cap = performance.now() - t0;
  window.lastShots = shots?.map((s) => ({ kind: s.kind, count: s.count, ms: s.ms, aspect: +s.aspect.toFixed(2), pos: s.pos }));
  np = createNewspaper({ host: $("host"), photo, cover, crop, coverBg: PAD_BG, data: data(), shots, reduced: $("reduced").checked, lite: $("lite").checked, safe: safe(), seed: +$("seed").value, family: "Amiri", sansFamily: "Signika", condFamily: "Modesto Condensed" });
  window.np = np;
  $("oldmap").classList.add("gone"); // „teardown”: stara scena znika, pod spodem nowa
  np.ready.then(() => log(`zrzut ${cap.toFixed(1)} ms · zdjęć grup ${shots?.length ?? 0} (sesja ${np.stats.shootMs ?? 0} ms) · strona ${np.stats.pageW}px w ${np.stats.buildMs} ms · najazd ${np.stats.pushIn ? JSON.stringify(Object.fromEntries(Object.entries(np.stats.crop).map(([k, v]) => [k, Math.round(v)]))) : "nie"}`));

async function run() {
  const n = begin();
  await n.press();
  await new Promise((r) => setTimeout(r, HOLD_MS + 400)); // w Foundry: czekanie na wspólny start (tgo)
  revealCamera(n.stats.reduced);
  await n.spin();
  log(`koniec · ${JSON.stringify(n.stats)}`);

async function reset() { $("oldmap").classList.remove("gone"); await drawOld(); }
$("run").onclick = run;
$("press").onclick = () => begin().press();
$("spin").onclick = () => { if (!np) return; revealCamera(np.stats.reduced); np.spin().then(reset); };
$("close").onclick = () => { np?.close(); reset(); };
$("toggle").onclick = () => $("panel").classList.toggle("min");
$("texts").onchange = () => setTexts($("texts").value);
$("pageview").onclick = () => pageView();
$("sheet").onclick = () => $("sheet").classList.remove("on");
$("ui").onchange = () => document.body.classList.toggle("ui", $("ui").checked);
$("old").onchange = drawOld; $("new").onchange = drawOld; $("pad").onchange = drawOld; $("shots").onchange = drawOld;
addEventListener("resize", drawOld);
/** Do weryfikacji: zatrzymaj wszystkie animacje na czasie t (ms) od startu bieżącej fazy. */
const freeze = async (t) => {
  const all = document.getAnimations();
  // tylko animacje bieżącej fazy (najpóźniej uruchomione); wcześniejsze zostają w stanie końcowym
  const last = Math.max(...all.map((a) => a.startTime ?? -Infinity));
  for (const a of all) {
    if ((a.startTime ?? last) < last - 100 && a.effect.getComputedTiming().endTime < 10000) { a.finish(); continue; }
    a.pause(); a.currentTime = Math.min(t, a.effect.getComputedTiming().endTime);

};
/** Nieruchoma klatka do zrzutów ekranu: faza "press" | "spin" w chwili t (ms) — np.seek() używa tych samych funkcji stanu. */
async function still(phase, t) {

  await np.ready;

  await np.seek(phase, Math.min(1, t / dur));

window.harness = { run, begin, reset, freeze, still, data, safe, capture, revealCamera, pageView, texts: (k) => { $("texts").value = k; setTexts(k); }, set: (o) => { for (const [k, v] of Object.entries(o)) { const el = $(k); if (el.type === "checkbox") el.checked = v; else el.value = v; el.onchange?.(); } } };
const q = new URLSearchParams(location.search);
if (q.has("pad")) $("pad").checked = true;
if (q.has("shots")) $("shots").value = q.get("shots");
if (q.has("reduced")) $("reduced").checked = true;
await drawOld();
if (q.has("clean")) document.body.classList.add("clean");
if (q.get("style") === "modern") { $("style").value = "modern"; $("kicker").value = "Exclusive"; }
if (q.has("texts")) { $("texts").value = q.get("texts"); setTexts(q.get("texts")); }
await Promise.all(["Amiri", "Signika", "Modesto Condensed"].flatMap((f) => [`400 20px "${f}"`, `700 20px "${f}"`].map((x) => document.fonts.load(x))));
if (q.has("auto")) run();
window.ready = true;
