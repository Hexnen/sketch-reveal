<!doctype html>
<meta charset="utf-8">
<title>sketch-reveal harness</title>
<style>
  html,body{margin:0;height:100%;background:#222;color:#ddd;font:14px sans-serif}
  #stage{position:fixed;inset:0 0 40px 0;background:#000;overflow:hidden}
  #bar{position:fixed;left:0;right:0;bottom:0;height:40px;display:flex;gap:8px;align-items:center;padding:0 8px}
  .sr-frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden}
  .sr-cam{position:absolute;inset:0;transform-origin:50% 50%;isolation:isolate}
  .sr-canvas{position:absolute;inset:0;width:100%;height:100%}
  .sr-title{position:absolute;left:0;right:0;bottom:9vmin;text-align:center;opacity:0;padding:0 6vmin;font-weight:600}
  .sr-title-dim{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.75),transparent)}
</style>
<div id="stage"></div>
<div id="bar"><button id="play">play</button><input id="p" type="range" min="0" max="1" step="0.001" style="flex:1"><span id="info"></span></div>
<script type="module">
  import { RevealPlayer } from "../scripts/player.mjs";
  import { sanitizeConfig } from "../scripts/config.mjs";
  const q = new URLSearchParams(location.search);
  const set = q.get("set") || "ulica";
  const over = q.get("cfg") ? JSON.parse(q.get("cfg")) : {};
  const cfg = sanitizeConfig({ effectId: q.get("effect") || "spread", ...over });
  const player = new RevealPlayer({
    container: document.getElementById("stage"),
    sketchUrl: `../samples/${set}/sketch.png`, paintedUrl: `../samples/${set}/painted.png`, config: cfg, fit: "contain",
  });
  window.player = player;
  const t0 = performance.now();
  try {
    await player.prepare();
    document.getElementById("info").textContent = `ready in ${Math.round(performance.now() - t0)} ms, total ${player.total}s, ${player.W}x${player.H}`;
    window.__ready = true;
  } catch (e) { document.getElementById("info").textContent = "ERROR " + e; window.__error = String(e); console.error(e); }
  player.onProgress = (p) => { document.getElementById("p").value = p; };
  document.getElementById("play").onclick = () => player.play();
  document.getElementById("p").oninput = (e) => player.setProgress(+e.target.value);
</script>
